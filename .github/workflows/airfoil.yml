name: Airfoil

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created

jobs:
  validate-airfoil:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      # The translator is plain Python run from the environment - OP2 ships no
      # interpreter of its own - so genseq/openmp, which are code-generated,
      # need one with its dependencies before anything is built.
      - name: Set up Python for the translator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: translator-v2/requirements.txt

      - name: Install translator dependencies
        run: python3 -m pip install -r translator-v2/requirements.txt

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DPython3_EXECUTABLE="$(command -v python3)" \
              -DOP2_ENABLE_APPS=ON -DOP2_ENABLE_TESTS=ON -DOP2_ENABLE_APP_TESTS=ON

      - name: Build airfoil
        run: cmake --build build -j"$(nproc)" --target airfoil_seq airfoil_genseq airfoil_openmp

      - name: Run airfoil against its mesh
        run: ctest --test-dir build -R '^airfoil_plain_dp_(seq|genseq|openmp)$' --output-on-failure
