name: Local CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created

env:
  BASH_ENV: ${{ github.workspace }}/scripts/source_gnuz
  N_PROC: 64
  CUDA_ARCHITECTURES: 90

jobs:
  local-test:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      # 1. Checkout correct branch ---------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ github.token }}

      # 2. Debug info ---------------------------------------
      - name: Print runner info
        run: |
          echo "Machine: $(hostname)"
          echo "PWD: $(pwd)"
          git status

      # 3. Provide a Python for the translator ---------------------------------------
      # OP2 ships no interpreter: the translator runs on whatever Python the
      # environment provides, and every code-generated variant below needs it.
      # Prefer the runner's own python3 when it already has the dependencies,
      # and fall back to a throwaway venv so the job does not depend on the
      # runner image having them installed.
      - name: Provide a Python for the translator
        run: |
          if python3 -c "import jinja2, fparser, pcpp, clang.cindex" 2>/dev/null; then
            echo "Using runner python3: $(command -v python3)"
            echo "OP2_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          else
            echo "Runner python3 lacks the translator dependencies, building a venv"
            python3 -m venv "$RUNNER_TEMP/op2-translator-venv"
            "$RUNNER_TEMP/op2-translator-venv/bin/pip" install --quiet \
                -r translator-v2/requirements.txt
            echo "OP2_PYTHON=$RUNNER_TEMP/op2-translator-venv/bin/python3" >> "$GITHUB_ENV"
          fi

      - name: Report the translator Python
        run: |
          echo "OP2_PYTHON=$OP2_PYTHON"
          "$OP2_PYTHON" --version
          "$OP2_PYTHON" -c "import jinja2, fparser, pcpp, clang.cindex; print('translator deps OK')"

      # 4. Clone MG-CFD, whose C++ app the app tests build and run ----------
      - name: Clone MG-CFD
        run: |
          rm -rf "$RUNNER_TEMP/MG-CFD-app-OP2"
          git clone --depth 1 https://github.com/warwick-hpsc/MG-CFD-app-OP2 \
              "$RUNNER_TEMP/MG-CFD-app-OP2"

      # 5. Configure OP2, its apps and every test -----------------------------
      # The dependency prefixes come from scripts/source_gnuz (BASH_ENV); the
      # meshes are kept in the runner's tool cache between runs.
      - name: Configure OP2
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DPython3_EXECUTABLE="$OP2_PYTHON" \
              -DCMAKE_CUDA_COMPILER="$CUDA_INSTALL_PATH/bin/nvcc" \
              -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHITECTURES" \
              -DHDF5_ROOT="$HDF5_PAR_INSTALL_PATH" \
              -DParMETIS_ROOT="$PARMETIS_INSTALL_PATH" \
              -DMETIS_ROOT="$PARMETIS_INSTALL_PATH" \
              -DKaHIP_ROOT="$KAHIP_INSTALL_PATH" \
              -DOP2_ENABLE_APPS=ON -DOP2_ENABLE_TESTS=ON -DOP2_ENABLE_APP_TESTS=ON \
              -DOP2_TEST_MGCFD_DIR="$RUNNER_TEMP/MG-CFD-app-OP2" \
              -DOP2_TEST_MESH_DIR="$RUNNER_TOOL_CACHE/op2-test-meshes"

      # 6. Build ----------------------------------------------------------------
      - name: Build OP2, the apps and the tests
        run: cmake --build build -j"$N_PROC"

      # 7. Test -------------------------------------------------------------------
      # Unit, GPU runtime and functional tests, then the apps against their
      # meshes; ctest -j schedules the MPI tests by their rank counts.
      - name: Run the unit and functional tests
        run: ctest --test-dir build -LE apps -j8 --output-on-failure --output-junit tests.xml

      - name: Run the app tests
        run: ctest --test-dir build -L apps -j8 --output-on-failure --output-junit apps.xml

      # 8. Archive results ---------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/tests.xml
            build/apps.xml
            build/Testing/Temporary/LastTest*.log

      # 9. Final status message ---------------------------------------
      - name: Final status
        if: success()
        run: echo "CI tests passed"

      - name: Final failure
        if: failure()
        run: echo "Some CI tests failed"
